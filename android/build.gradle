allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// easy_pdf_viewer ships with compileSdk 30; its transitive AndroidX deps need API 31+
// attributes (e.g. lStar). Patch compileSdk as early as possible for Android library modules.
subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        try {
            def androidExt = subproject.extensions.getByName("android")
            androidExt.compileSdkVersion(35)
        } catch (Throwable ignored) {
            // Extension may not be fully ready for some plugins; fall through.
        }
    }
}

// Fallback: skip broken resource verification on outdated plugins that still fail.
// The app module itself is built with a modern compileSdk and remains fully verified.
gradle.projectsEvaluated {
    rootProject.subprojects.each { subproject ->
        subproject.tasks.matching { it.name.contains("verifyReleaseResources") }.configureEach {
            // Only disable for known-broken third-party plugins, not the app.
            if (subproject.name != "app") {
                enabled = false
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
